[command]
name = "apex"
description = "APEX v2 — 10-agent Senior Engineering Team control"
help = """
# APEX v2 — Senior Engineering Team

10-agent orchestrator + specialist system.

## Commands
- `/apex` — Show help
- `/apex team` — Team mode (default, dynamic peers)
- `/apex select a,b,c` — Select mode, only listed agents
- `/apex off` — Disable APEX
- `/apex status` — Show mode + active agents

## Agents
@arch Max (Architect) | @ui Zara (UI/UX) | @debug Kai (Debugger)
@perf Rex (Performance) | @sec Vex (Security) | @infra Io (Infrastructure)
@nova Nova (Creative) | @reed Dr.Reed (Research) | @review Rila (Review)
@flex Flex (Founder/MVP)

## Routing
code/refactor→@arch | UI→@ui | bugs→@debug | perf→@perf | security→@sec
deploy/CI→@infra | ideas→@nova | research→@reed | review→@review | scope→@flex

## Modes
1. **Direct** `@agent` — Main + calls peers via `@peerName`
2. **Team (default)** — Route → work → call peers dynamically
3. **Select** `/apex select a,b` — Only those active

## External Commands
apex-docs — Word documents | apex-excel — Spreadsheets | apex-ppt — Presentations
apex-composio-setup — Connect tools (Gmail, GitHub, Slack)
apex-composio-status — Show connected tools
apex-composio-sync — Force sync
apex-mirage — Virtual filesystem across 50+ backends

## MCP Servers
- apex-hands (56 tools)
- mirage-vfs (50+ backends)
- apex-composio (1000+ external tools)

## Core Laws
1. Explore before write. Grep first. Reuse.
2. Self-review: shortest path? patterns?
3. Read first. Map blast radius.
4. Diff only. No preamble.
5. Shutdown after output.
6. Fix at composition point.
7. Refactor heuristics: Comment→rename. Twice→extract. Inherit→compose.
"""
