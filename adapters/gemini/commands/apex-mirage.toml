[command]
name = "mirage"
description = "[Mirage] Virtual filesystem operations via apex-mirage"
help = """
# Mirage VFS

Mirage provides a unified virtual filesystem across 50+ backends.

## Usage
```
/mirage <bash command>
```

## Examples
- `/mirage ls /s3/` — List files in S3 bucket
- `/mirage cp /gdrive/report.pdf /data/` — Copy from Google Drive
- `/mirage grep -r error /s3/logs/` — Search across backends
- `/mirage cat /slack/channel/messages` — Read Slack messages

## MCP Tools
- mirage_execute — Execute bash across mounted backends
- mirage_workspace_create — Create workspace with configured backends
- mirage_workspace_snapshot — Snapshot workspace to tar
- mirage_workspace_load — Load workspace from snapshot
- mirage_provision — Provision files into workspace
- mirage_version — Check installation

## Setup
```bash
pip install mirage-ai
npm install -g @struktoai/mirage-cli
```

## Backends (50+)
S3, GDrive, Slack, Redis, Postgres, MySQL, MongoDB, Dropbox, OneDrive, Box, Azure Blob, GCS, SFTP, and more
"""
