name: apex
version: 3.0.0
description: APEX v2 — 10-agent senior engineering team. 3 MCP servers (62+ tools), Composio (1000+ tools), Mirage VFS (50+ backends), OfficeCLI.
author: asno-dev
provides_hooks:
  - pre_tool_use
  - post_tool_use
  - session_start
  - subagent_start
  - user_prompt_submit
provides_commands:
  - apex
  - apex-arch
  - apex-ui
  - apex-debug
  - apex-perf
  - apex-sec
  - apex-infra
  - apex-nova
  - apex-reed
  - apex-review
  - apex-flex
  - apex-docs
  - apex-excel
  - apex-ppt
  - apex-composio-setup
  - apex-composio-status
  - apex-composio-sync
  - apex-mirage
provides_skills:
  - apex
  - apex-arch
  - apex-ui
  - apex-debug
  - apex-perf
  - apex-sec
  - apex-infra
  - apex-nova
  - apex-reed
  - apex-review
  - apex-flex
  - refactor
  - ui-generate
  - debug-protocol
  - perf-audit
  - sec-review
  - pr-review
  - system-design
  - research
  - mvp-cut
  - full-stack-scaffold
  - test-harness
  - bug-patch
  - requirements-to-spec
  - deploy-pipeline
mcp_servers:
  - name: apex-hands
    type: local
    command: ["node", "src/hands-server.mjs"]
    tools: 56
  - name: mirage-vfs
    type: local
    command: ["node", "src/mirage-server.mjs"]
    tools: 6
  - name: apex-composio
    type: local
    command: ["node", "src/composio-server.mjs"]
    tools: 1000+
subagents:
  - arch
  - ui
  - debug
  - perf
  - sec
  - infra
  - nova
  - reed
  - review
  - flex
features:
  modes: [direct, team, select]
  composio: true
  mirage: true
  officecli: true
  agent_chains: true
  dynamic_peers: true
